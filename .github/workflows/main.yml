name: Starter Workflow Demo

on:
  workflow_call:
    inputs:
      app_name:
        description: "Nombre del aplicativo (será usado como el nombre de la imagen)"
        required: true
        default: "aspnetapp2"
        type: string

  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: demo workflow job
        run: echo This is a demo start workflow
      
      # Get the branch name
      - name: Get Branch Name
        id: get_branch
        run: |
          branch_name=${GITHUB_REF#refs/heads/}
          echo "branch_name=$branch_name" >> $GITHUB_ENV
          echo "Current branch: $branch_name"
      
      # Get the latest version tag
      - name: Get Latest Version Tag
        id: get_latest_tag
        run: |
          latest_tag=$(git tag --list "v[0-9]*.[0-9]*.[0-9]*" --sort=-v:refname | head -n 1)
          if [ -z "$latest_tag" ]; then
            latest_tag="v0.0.0" # Default initial version
          fi
          echo "latest_tag=${latest_tag}" >> $GITHUB_ENV
          echo "Latest tag: $latest_tag"

      # Define the new version based on branch type
      - name: Define New Version
        id: define_version
        run: |
          latest_tag=${{ env.latest_tag }}
          clean_tag=${latest_tag#v} # Remove the 'v' prefix
          IFS='.' read -r -a parts <<< "$clean_tag"
          major=${parts[0]}
          minor=${parts[1]}
          patch=${parts[2]}

          case "${{ env.branch_name }}" in
            main)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            development)
              minor=$((minor + 1))
              patch=0
              ;;
            hotfix/*)
              patch=$((patch + 1))
              ;;
            *)
              echo "Unknown branch type. No version increment."
              exit 1
              ;;
          esac

          new_version="v${major}.${minor}.${patch}"
          echo "new_version=${new_version}" >> $GITHUB_ENV
          echo "New version: $new_version"
      
      # Log in to the Docker registry
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build the Docker image
      - name: Build Docker Image
        run: |
          new_tag=${{ env.new_version }}
          final_tag=${new_tag#v} # Remove the 'v' prefix
          docker build -t ${{ secrets.DOCKER_USERNAME }}/aspnetapp:$final_tag .

      # Push the Docker image to the registry
      - name: Push Docker Image
        run: |
          new_tag=${{ env.new_version }}
          final_tag=${new_tag#v} # Remove the 'v' prefix
          docker push ${{ secrets.DOCKER_USERNAME }}/aspnetapp:$final_tag
      
      # Tag the commit with the new version
      - name: Tag the new version
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "${{ env.new_version }}" -m "Release ${{ env.new_version }}"
          git push origin "${{ env.new_version }}"